name: Release

# Trigger on a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# The `quality` job (lint + tests + dependency audits) must pass before any
# platform is built and uploaded to the GitHub Release.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test & dependency audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # --- Dependency security ---
      - name: Audit npm dependencies (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies (RustSec)
        working-directory: src-tauri
        run: cargo audit

      # --- Lint ---
      - name: Formatting (rustfmt --check)
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Typecheck & build frontend (tsc + vite)
        run: npm run build

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # --- Tests ---
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  # One release object, created before any platform builds. Letting each
  # matrix job create its own release races: in v0.6.0 four concurrent jobs
  # produced two drafts for the same tag, splitting the nine installers
  # across them. The build job below uploads into this id instead.
  create-release:
    name: Create draft release
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create or reuse the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # A re-run must reuse the existing draft rather than add a second one.
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG_NAME\")] | first | .id // empty")
          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG_NAME" \
              -f name="claude-multi $TAG_NAME" \
              -f body="$(printf 'Download the installer for your OS below.\n\nBuilds are **unsigned** (ad-hoc) — on first launch your OS may warn\nabout an unidentified developer. See the README for how to allow it.')" \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  release:
    name: Build & release (${{ matrix.platform }} ${{ matrix.args }})
    needs: [quality, create-release]
    # Only build/publish on a version tag. A manual workflow_dispatch from a
    # branch runs just the `quality` gate (no bogus release is created).
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'   # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'   # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The bundle filenames and app metadata come from tauri.conf.json, not
      # from the tag — a mismatch ships binaries that self-identify as the
      # wrong version (this happened with v0.2.0, whose assets say 0.1.0).
      - name: Verify tag matches app version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$APP_VERSION" != "$TAG_NAME" ]; then
            echo "Tag $TAG_NAME does not match tauri.conf.json version v$APP_VERSION" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS runners build both arches; other platforms keep the host target.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action runs `tauri build` (which runs the frontend build via
      # beforeBuildCommand), bundles per-OS installers, and uploads them to
      # the draft release created by the `create-release` job.
      #
      # To produce signed/notarized builds later, add the signing secrets and
      # expose them here, e.g. (macOS):
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build & upload (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Upload into the release `create-release` already made. Passing
          # releaseId (instead of tagName/releaseName) is what keeps the
          # concurrent matrix jobs from each creating their own draft.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # v0.6.0 shipped a bundle whose only executable was the `cms` CLI — with
      # two bin targets the bundler picked the wrong one, and every job still
      # reported success. The app links WebKit and the CLI does not, which is
      # the cheapest proof that the bundled binary is really the tray app.
      - name: Verify the bundle ships the app binary
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          APP=$(find src-tauri/target -type d -name 'claude-multi.app' | head -1)
          if [ -z "$APP" ]; then
            echo "no claude-multi.app bundle found" >&2
            exit 1
          fi
          EXEC=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")
          if [ "$EXEC" != "claude-multi" ]; then
            echo "CFBundleExecutable is '$EXEC', expected 'claude-multi'" >&2
            exit 1
          fi
          if ! otool -L "$APP/Contents/MacOS/$EXEC" | grep -q WebKit.framework; then
            echo "bundled '$EXEC' does not link WebKit — it is not the tray app" >&2
            exit 1
          fi
